name: gfxreconstruct test

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Public GitHub URL containing /tree/branch or /commit/SHA'
        required: true
        type: string
      suite:
        description: Test suite
        required: true
        default: smoke
        type: choice
        options: [smoke]
      build_type:
        description: CMake build type
        required: true
        default: Release
        type: choice
        options: [Release, Debug, RelWithDebInfo]

# Target code is untrusted. Do not attach secrets or privileged runners here.
permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.suite }} / ${{ inputs.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout test harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build test environment
        run: docker build --tag gfxreconstruct-test-env:${{ github.sha }} .

      - name: Build and test requested revision
        env:
          REPOSITORY: ${{ inputs.repository }}
          SUITE: ${{ inputs.suite }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          mkdir -p out
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:exec \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace/harness" \
            --workdir /workspace/harness \
            gfxreconstruct-test-env:${{ github.sha }} \
            ./scripts/run-tests.sh \
              --repository "$REPOSITORY" \
              --suite "$SUITE" \
              --build-type "$BUILD_TYPE"

      - name: Add result summary
        if: always()
        run: |
          if [[ -f out/metadata.txt ]]; then
            {
              echo '## gfxreconstruct test result'
              echo
              echo '```text'
              cat out/metadata.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gfxreconstruct-test-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
