name: gfxreconstruct test

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Public GitHub URL containing /tree/branch or /commit/SHA'
        required: true
        type: string
      suite:
        description: Test suite
        required: true
        default: smoke
        type: choice
        options: [smoke, contracts]
      build_type:
        description: CMake build type
        required: true
        default: Release
        type: choice
        options: [Release, Debug, RelWithDebInfo]

# Target code is untrusted. Do not attach secrets or privileged runners here.
permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.suite }} / ${{ inputs.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout test harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build test environment
        run: docker build --tag gfxreconstruct-test-env:${{ github.sha }} .

      - name: Build and test requested revision
        id: tests
        env:
          REPOSITORY: ${{ inputs.repository }}
          SUITE: ${{ inputs.suite }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          mkdir -p out
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:exec \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace/harness" \
            --workdir /workspace/harness \
            gfxreconstruct-test-env:${{ github.sha }} \
            ./scripts/run-tests.sh \
              --repository "$REPOSITORY" \
              --suite "$SUITE" \
              --build-type "$BUILD_TYPE"

      - name: Upload logs and reports
        id: reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gfxreconstruct-test-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 14

      - name: Add result summary
        if: always()
        env:
          SUITE: ${{ inputs.suite }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          ARTIFACT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: |
          {
            if [[ $SUITE == contracts && -f out/contracts-report.md ]]; then
              cat out/contracts-report.md
            else
              printf '## GFXReconstruct %s test result\n\n' "$SUITE"
              printf 'Build and test step: **%s**.\n\n' "$TEST_OUTCOME"
              if [[ $SUITE == contracts ]]; then
                printf 'No contract report was produced. See the build and test logs.\n\n'
              fi
            fi
            if [[ -n $ARTIFACT_URL ]]; then
              printf '\n[Download logs and reports](%s)\n\n' "$ARTIFACT_URL"
              if [[ $SUITE == contracts && -f out/contracts-report.md ]]; then
                printf 'Extract the archive and open `contracts-report.html` for the full contract report.\n\n'
              fi
            else
              printf '\nReport artifact unavailable; see the workflow logs.\n\n'
            fi
            if [[ -f out/metadata.txt ]]; then
              printf '<details><summary>Build metadata</summary>\n\n'
              sed 's/^/    /' out/metadata.txt
              printf '\n</details>\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
