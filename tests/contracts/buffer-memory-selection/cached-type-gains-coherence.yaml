description: Move coherent upload to the combined type while retaining cached readback memory when type properties change.
profile: VulkanCore-1.4

capture:
  memory-types:
    - [DEVICE_LOCAL]
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_COHERENT]
    - [DEVICE_LOCAL, LAZILY_ALLOCATED]
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_CACHED]
    - [DEVICE_LOCAL, PROTECTED]

replay:
  memory-types:
    - [DEVICE_LOCAL]
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_CACHED]
    - [DEVICE_LOCAL, LAZILY_ALLOCATED]
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_COHERENT, HOST_CACHED]
    - [DEVICE_LOCAL, PROTECTED]
  arguments: [--memory-translation, rebind]

observe:
  upload-buffer-unflushed: memory-type
  upload-buffer-storage-unflushed: memory-type
  upload-buffer-vertex-unflushed: memory-type
  readback-buffer: memory-type
  optimal-image: memory-type
