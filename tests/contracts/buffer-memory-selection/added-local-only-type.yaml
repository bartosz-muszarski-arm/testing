description: Prefer coherent upload, cached readback, and local-only image memory when replay adds a device-local-only type.
profile: VulkanCore-1.4

capture:
  memory-types:
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_COHERENT]
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_CACHED]
    - [DEVICE_LOCAL, LAZILY_ALLOCATED]
    - [DEVICE_LOCAL, PROTECTED]

replay:
  memory-types:
    - [DEVICE_LOCAL]
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_COHERENT]
    - [DEVICE_LOCAL, LAZILY_ALLOCATED]
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_CACHED]
    - [DEVICE_LOCAL, PROTECTED]
  arguments: [--memory-translation, rebind]

observe:
  upload-buffer: memory-type
  readback-buffer: memory-type
  optimal-image: memory-type

expect:
  upload-buffer: [DEVICE_LOCAL, HOST_VISIBLE, HOST_COHERENT]
  readback-buffer: [DEVICE_LOCAL, HOST_VISIBLE, HOST_CACHED]
  optimal-image: [DEVICE_LOCAL]
