description: Prefer combined coherent-cached memory for upload and readback over cached-only memory, and local-only memory for the optimal image.
profile: VulkanCore-1.4

capture:
  memory-types:
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_COHERENT]
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_CACHED]
    - [DEVICE_LOCAL, LAZILY_ALLOCATED]
    - [DEVICE_LOCAL, PROTECTED]

replay:
  memory-types:
    - [DEVICE_LOCAL]
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_CACHED]
    - [DEVICE_LOCAL, LAZILY_ALLOCATED]
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_COHERENT, HOST_CACHED]
    - [DEVICE_LOCAL, PROTECTED]
  arguments: [--memory-translation, rebind]

observe:
  upload-buffer: memory-type
  readback-buffer: memory-type
  optimal-image: memory-type

expect:
  upload-buffer: [DEVICE_LOCAL, HOST_VISIBLE, HOST_COHERENT, HOST_CACHED]
  readback-buffer: [DEVICE_LOCAL, HOST_VISIBLE, HOST_COHERENT, HOST_CACHED]
  optimal-image: [DEVICE_LOCAL]
