description: Preserve upload coherence and captured readback caching when a combined coherent-cached type is added, and prefer local memory for the optimal image.
profile: VulkanCore-1.4

capture:
  memory-types:
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_COHERENT]
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_CACHED]
    - [DEVICE_LOCAL, LAZILY_ALLOCATED]
    - [DEVICE_LOCAL, PROTECTED]

replay:
  memory-types:
    - [DEVICE_LOCAL]
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_CACHED]
    - [DEVICE_LOCAL, LAZILY_ALLOCATED]
    - [DEVICE_LOCAL, HOST_VISIBLE, HOST_COHERENT, HOST_CACHED]
    - [DEVICE_LOCAL, PROTECTED]
  arguments: [--memory-translation, rebind]

observe:
  upload-buffer: upload-unflushed
  readback-buffer: readback
  optimal-image: optimal-image
